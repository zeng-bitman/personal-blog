<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Article | Blog Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="bg-slate-100 text-slate-900 min-h-screen">


    <!-- ================= NAVBAR ================= -->

    <nav class="bg-slate-900 text-white">

        <div class="max-w-7xl mx-auto px-6">

            <div class="flex items-center justify-between h-16">

                <a href="/dashboard" class="text-xl font-bold">
                    Blog Admin
                </a>


                <div class="flex items-center gap-5">

                    <a href="/dashboard" class="text-slate-300
                               hover:text-white
                               transition">
                        Dashboard
                    </a>

                    <a href="/logout" class="text-slate-300
                               hover:text-white
                               transition">
                        Logout
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="max-w-4xl
               mx-auto
               px-6
               py-10">

        <!-- Page heading -->

        <div class="mb-8">

            <p class="text-sm
                       uppercase
                       tracking-widest
                       text-slate-500
                       font-semibold
                       mb-2">
                Administration
            </p>

            <h1 class="text-3xl
                       md:text-4xl
                       font-bold">
                Write a New Article
            </h1>

            <p class="text-slate-500
                       mt-2">
                Share your thoughts, experiences and ideas.
            </p>

        </div>


        <!-- ================= FORM ================= -->

        <form method="POST" action="/add-article" class="bg-white
                   border
                   border-slate-200
                   rounded-2xl
                   shadow-sm
                   p-6
                   md:p-8">

            <!-- Title -->

            <div class="mb-7">

                <label for="title" class="block
                           text-sm
                           font-semibold
                           text-slate-700
                           mb-2">
                    Article Title
                </label>


                <input type="text" id="title" name="title" placeholder="Enter your article title" required
                    maxlength="200" class="w-full
                           px-4 py-3
                           rounded-lg
                           border
                           border-slate-300
                           outline-none
                           focus:ring-2
                           focus:ring-slate-400
                           focus:border-slate-500
                           transition">

                <p class="text-xs
                           text-slate-400
                           mt-2">
                    Keep your title clear and descriptive.
                </p>

            </div>


            <!-- Publication Date -->

            <div class="mb-7">

                <label for="publication_date" class="block
                           text-sm
                           font-semibold
                           text-slate-700
                           mb-2">
                    Publication Date
                </label>


                <input type="date" id="publication_date" name="publication_date" required class="w-full
                           px-4 py-3
                           rounded-lg
                           border
                           border-slate-300
                           outline-none
                           focus:ring-2
                           focus:ring-slate-400
                           focus:border-slate-500
                           transition">

            </div>


            <!-- Content -->

            <div class="mb-7">

                <div class="flex
                           items-center
                           justify-between
                           mb-2">

                    <label for="content" class="block
                               text-sm
                               font-semibold
                               text-slate-700">
                        Article Content
                    </label>


                    <span id="characterCount" class="text-xs
                               text-slate-400">
                        0 characters
                    </span>

                </div>


                <textarea id="content" name="content" rows="16" placeholder="Start writing your article..." required
                    class="w-full
                           px-4 py-3
                           rounded-lg
                           border
                           border-slate-300
                           outline-none
                           resize-y
                           focus:ring-2
                           focus:ring-slate-400
                           focus:border-slate-500
                           leading-7
                           transition"></textarea>


                <p class="text-xs
                           text-slate-400
                           mt-2">
                    Write your article with clear paragraphs.
                </p>

            </div>


            <!-- Buttons -->

            <div class="flex
                       flex-col-reverse
                       sm:flex-row
                       sm:justify-end
                       gap-3
                       pt-5
                       border-t
                       border-slate-200">

                <a href="/dashboard" class="text-center
                           px-6 py-3
                           rounded-lg
                           border
                           border-slate-300
                           text-slate-700
                           font-semibold
                           hover:bg-slate-50
                           transition">
                    Cancel
                </a>


                <button type="submit" class="px-6 py-3
                           rounded-lg
                           bg-slate-900
                           text-white
                           font-semibold
                           hover:bg-slate-700
                           transition">
                    Publish Article
                </button>

            </div>

        </form>

    </main>


    <!-- JavaScript -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>

        const dateInput =
            document.getElementById("publication_date");

        if (dateInput) {

            const today =
                new Date().toISOString().split("T")[0];

            dateInput.value = today;

        }

    </script>

</body>

</html>
