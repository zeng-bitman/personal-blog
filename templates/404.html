<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | My Personal Blog</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-100
           min-h-screen
           flex
           items-center
           justify-center
           px-6">


    <main class="text-center
               max-w-lg">

        <p class="text-8xl
                   font-bold
                   text-slate-300">
            404
        </p>


        <h1 class="text-3xl
                   font-bold
                   text-slate-900
                   mt-4">
            Article Not Found
        </h1>


        <p class="text-slate-500
                   mt-4
                   leading-7">
            Sorry, the article you're looking for
            doesn't exist or may have been removed.
        </p>


        <a href="/" class="inline-block
                   mt-8
                   bg-slate-900
                   text-white
                   px-6 py-3
                   rounded-lg
                   font-semibold
                   hover:bg-slate-700
                   transition">
            ← Back to Home
        </a>

    </main>


</body>

</html>
