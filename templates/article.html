<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ article[1] }} | My Personal Blog</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-slate-100 text-slate-900 min-h-screen">


    <!-- ================= NAVBAR ================= -->

    <nav class="bg-slate-900 text-white">

        <div class="max-w-7xl mx-auto px-6">

            <div class="flex items-center justify-between h-16">

                <!-- Blog name -->

                <a href="/" class="text-xl font-bold tracking-wide">
                    My Personal Blog
                </a>


                <!-- Navigation -->

                <div class="flex items-center gap-6">

                    <a href="/" class="text-slate-300
                               hover:text-white
                               transition">
                        All Articles
                    </a>

                    <a href="/login" class="text-slate-300
                               hover:text-white
                               transition">
                        Admin
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- ================= ARTICLE ================= -->

    <main class="max-w-4xl mx-auto px-6 py-12">

        <article class="bg-white
                   rounded-2xl
                   border border-slate-200
                   shadow-sm
                   overflow-hidden">

            <!-- Article Header -->

            <header class="px-6 md:px-12
                       pt-10 md:pt-14">

                <!-- Category -->

                <div class="mb-5">

                    <span class="inline-block
                               bg-slate-100
                               text-slate-600
                               text-xs
                               font-semibold
                               uppercase
                               tracking-widest
                               px-3 py-2
                               rounded-full">
                        Article
                    </span>

                </div>


                <!-- Title -->

                <h1 class="text-4xl
                           md:text-5xl
                           font-bold
                           leading-tight">
                    {{ article[1] }}
                </h1>


                <!-- Date -->

                <div class="flex
                           items-center
                           gap-2
                           text-slate-500
                           mt-5">

                    <span>
                        📅
                    </span>

                    <span>
                        Published {{ article[3] }}
                    </span>

                </div>

            </header>


            <!-- Divider -->

            <div class="mx-6 md:mx-12
                       my-8
                       border-t
                       border-slate-200">
            </div>


            <!-- Article Content -->

            <div class="px-6 md:px-12
                       pb-12">

                <div class="article-content
           text-lg
           leading-8
           text-slate-700
           whitespace-pre-line">

                    {{ article[2] }}

                </div>

            </div>


            <!-- Article Footer -->

            <footer class="border-t
                       border-slate-200
                       bg-slate-50
                       px-6 md:px-12
                       py-6">

                <a href="/" class="inline-flex
                           items-center
                           gap-2
                           text-slate-700
                           font-semibold
                           hover:text-slate-900
                           transition">

                    <span>
                        ←
                    </span>

                    Back to all articles

                </a>

            </footer>

        </article>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-slate-900
               text-slate-400
               text-center
               py-6
               mt-10">

        <p class="text-sm">
            © 2026 My Personal Blog
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
